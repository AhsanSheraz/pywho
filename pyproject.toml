[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywho"
version = "0.3.3"
description = "Debugging painkiller for Python developers - One command to explain your Python environment, trace imports, and detect shadows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ahsan Sheraz", email = "ahsansheraz@gmail.com" },
]
keywords = [
    "python", "environment", "debug", "venv", "virtualenv",
    "interpreter", "diagnostic", "cli", "devtools", "import", "trace",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.scripts]
pywho = "pywho.cli:main"

[project.urls]
Homepage = "https://github.com/AhsanSheraz/pywho"
Repository = "https://github.com/AhsanSheraz/pywho"
Issues = "https://github.com/AhsanSheraz/pywho/issues"
Documentation = "https://pywho.readthedocs.io/"
Changelog = "https://github.com/AhsanSheraz/pywho/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pywho"]

[tool.hatch.build.targets.sdist]
include = ["src/pywho", "README.md", "LICENSE", "CHANGELOG.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "mypy>=1.0,<1.19.0",
    "ruff>=0.15.17",
    "pre-commit<4.6.0; python_version < '3.10'",
    "pre-commit>=4.6.0; python_version >= '3.10'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "UP007",  # Use X | Y for union types (need 3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["pywho"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py39, py310, py311, py312, py313, lint, typecheck
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=7.0
commands =
    pytest -v {posargs}

[testenv:lint]
deps =
    ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typecheck]
deps =
    mypy>=1.0,<1.19.0
commands =
    mypy src/pywho
"""
